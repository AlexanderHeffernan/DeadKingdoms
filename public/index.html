<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Dead Kingdoms</title>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <div id="join" class="join">
            <form id="joinForm" class="join-panel">
                <h1>Dead Kingdoms</h1>
                <div
                    id="onlinePlayers"
                    class="online-players"
                    aria-live="polite"
                >
                    Players online: --
                </div>
                <label>
                    Username
                    <input
                        id="nameInput"
                        maxlength="18"
                        autocomplete="off"
                        placeholder="Town founder"
                    />
                </label>
                <label>
                    Player colour
                    <input
                        id="colorInput"
                        type="color"
                        value="#4f8fd8"
                        aria-label="Player colour"
                    />
                </label>
                <div
                    id="joinNotice"
                    class="join-notice"
                    aria-live="polite"
                ></div>
                <button type="submit">Play Game</button>
            </form>
            <aside class="update-boxes" aria-label="Server update status">
                <div class="update-box">
                    <span>Last update date</span>
                    <strong id="lastUpdateDate">--</strong>
                </div>
                <div class="update-box">
                    <span>Last update time</span>
                    <strong id="lastUpdateTime">--</strong>
                </div>
            </aside>
        </div>

        <main id="game" class="game hidden">
            <canvas
                id="world"
                width="1280"
                height="720"
                draggable="false"
            ></canvas>
            <section class="hud top-left">
                <div id="resources" class="resources"></div>
                <div id="status" class="status"></div>
                <button id="leaveButton" class="leave-button" type="button">
                    Leave game
                </button>
            </section>
            <section class="hud top-right">
                <h2>Leaderboard</h2>
                <div id="ping" class="ping">Ping --ms</div>
                <div id="fps" class="ping">FPS --</div>
                <ol id="leaderboard"></ol>
                <button
                    id="muteButton"
                    class="mute-button"
                    type="button"
                    aria-label="Mute music"
                    title="Mute music"
                ></button>
                <canvas
                    id="minimap"
                    width="180"
                    height="180"
                    aria-label="Minimap"
                ></canvas>
            </section>
            <section class="hud bottom">
                <div id="selection" class="selection"></div>
                <div id="actions" class="actions"></div>
            </section>
            <section id="toast" class="toast"></section>
        </main>

        <script type="module" src="/js/app.js"></script>
    </body>
</html>
