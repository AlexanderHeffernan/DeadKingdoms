  <rect x="9" y="20" width="6" height="1" fill="#20241f"/>
  <rect x="7" y="21" width="10" height="1" fill="#20241f"/>
  <rect x="9" y="22" width="6" height="1" fill="#20241f"/>
  <!-- spear angled to camera-right -->
  <rect x="15" y="5" width="1" height="1" fill="#d8c995"/>
