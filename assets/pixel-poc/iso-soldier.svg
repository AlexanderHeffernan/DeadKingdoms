  <rect x="7" y="6" width="9" height="1" fill="#8b9290"/>
  <rect x="8" y="7" width="5" height="1" fill="#b9bfb8"/>
  <rect x="13" y="7" width="4" height="1" fill="#646b6d"/>
  <rect x="8" y="8" width="8" height="1" fill="#555d62"/>
